services:
  mysql:
    image: mysql:8
    container_name: custodychain-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: custodychain
      MYSQL_USER: custodychain
      MYSQL_PASSWORD: custodychain_dev
      MYSQL_ROOT_PASSWORD: root_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
